name: E2E Tests
on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Which backend to test'
        required: true
        default: 'both'
        type: choice
        options:
          - claude-code
          - codex
          - both

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillshub
          POSTGRES_PASSWORD: skillshub
          POSTGRES_DB: skillshub
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U skillshub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Claude Code CLI
        if: inputs.backend == 'claude-code' || inputs.backend == 'both'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        if: inputs.backend == 'codex' || inputs.backend == 'both'
        run: npm install -g @openai/codex

      - name: Build packages
        run: pnpm build

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://skillshub:skillshub@localhost:5432/skillshub
        run: pnpm db:migrate

      - name: Run E2E tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: postgresql://skillshub:skillshub@localhost:5432/skillshub
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: skillshub-artifacts
          RUNNER_WORKDIR_BASE: /tmp/skillshub-runs
        run: |
          case "${{ inputs.backend }}" in
            claude-code)
              pnpm vitest run --config tests/e2e/vitest.config.ts tests/e2e/claude-code-golden-path.test.ts tests/e2e/cross-backend-comparability.test.ts
              ;;
            codex)
              pnpm vitest run --config tests/e2e/vitest.config.ts tests/e2e/codex-golden-path.test.ts tests/e2e/cross-backend-comparability.test.ts
              ;;
            both)
              pnpm vitest run --config tests/e2e/vitest.config.ts
              ;;
          esac
